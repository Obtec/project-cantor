spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=LEGACY
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: test-secret-key-that-is-definitely-long-enough-32-bytes
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost
  storage:
    upload-dir: ${java.io.tmpdir}/cantor-test-uploads
  seed:
    editor-email: editor@test.local
    editor-password: editor1234
