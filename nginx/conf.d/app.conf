# Edge nginx: TLS 종단 + 백엔드 프록시.
# 백엔드(Spring Boot)가 프론트엔드(SPA)와 API(/api)를 모두 서빙하므로 모든 요청을 backend로 보낸다.
# 로컬에서는 HTTP(80)만으로 바로 동작한다.
# 운영에서 인증서를 발급(init-letsencrypt.sh)한 뒤 아래 HTTPS 블록의 주석을 해제하면 된다.
#
# backend 호스트는 upstream 블록 대신 변수+resolver로 런타임에 해석한다.
# 이렇게 하면 backend 컨테이너가 아직 안 떠 있어도 nginx가 정상 부팅하여
# ACME 챌린지를 서빙할 수 있고, backend 재시작에도 nginx가 죽지 않는다.

server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME 챌린지 (HTTP-01)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 50m;

    location / {
        resolver 127.0.0.11 valid=30s;   # docker 내부 DNS
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

