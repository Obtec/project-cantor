# 프론트엔드 컨테이너 내부 nginx: 정적 파일 서빙 + SPA 라우팅 fallback.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 정적 자산 캐시
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: 알 수 없는 경로는 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
